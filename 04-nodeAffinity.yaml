kind: Pod
apiVersion: v1
metadata:
  name: node-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
           - key: "hardware"
             operator: "In"
             values:
             - gpu
            
  containers:
  - name: nginx
    image: nginx